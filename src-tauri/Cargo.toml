[package]
name = "moonsprite"
version = "1.0.0-beta2"
description = "An original, source-available pixel art workstation for Windows."
authors = ["MoonSprite contributors"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "moonsprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
png = { version = "0.18.1", features = ["zlib-rs"] }
ttf-parser = "0.25"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["semver"] }
rfd = "0.15"
arboard = "3.4"
sysinfo = "0.35"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
