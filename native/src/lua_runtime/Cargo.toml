[package]
name = "moonsprite-lua-runtime"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mlua = { version = "=0.10.5", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
