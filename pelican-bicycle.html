<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>顺风骑行 · Pelican Bicycle Club</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#eee9db;color:#243f43;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:grid;place-items:center;padding:32px}
  main{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:center;padding:0 3px 20px;border-bottom:1px solid #243f4340}.brand{font:12px/1.5 system-ui,sans-serif;letter-spacing:3px}.edition{font:11px system-ui,sans-serif;letter-spacing:2px}
  h1{font-size:clamp(36px,6vw,70px);font-weight:400;letter-spacing:-2px;margin:30px 0 6px}.intro{font:14px/1.7 system-ui,sans-serif;color:#607274;margin:0 0 24px}svg{display:block;width:100%;height:auto;background:#d7e8df;border-radius:3px}
  footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:19px;font:12px/1.7 system-ui,sans-serif;color:#607274}button{font:12px system-ui,sans-serif;background:none;border:1px solid #243f4360;padding:10px 18px;color:#243f43;cursor:pointer;border-radius:30px}button:hover{background:#243f43;color:#fff}button:focus-visible{outline:3px solid #c16a3f;outline-offset:4px}
  @media(max-width:600px){body{padding:18px}.edition{display:none}footer{font-size:10px}h1{margin-top:22px}}
</style>
</head>
<body>

 <h1>A little coastal cruising.</h1>
 <p class="intro">海风刚好，慢慢骑。今天的目的地，是下一阵顺风。</p>

 <g fill="none" stroke="#547d79" stroke-width="2.5" stroke-linecap="round"><path d="M753 205q10-10 19 0 10-10 19 0M685 171q7-7 14 0 7-7 14 0"/></g>

 <g fill="#577a67" id="grass"><path d="M89 510q-3-28-18-38 18 4 24 28 3-30 20-37-10 22-13 47ZM999 551q-2-22-15-29 15 2 20 21 4-24 17-30-9 22-11 38Z"/></g>
 <text x="36" y="585" font-family="system-ui,sans-serif" font-size="11" letter-spacing="3" fill="#61746b">SLOW DAYS, HAPPY MILES.</text>
 </svg>
 <footer><span>纯 SVG 动画 · 一只鹈鹕，一路海风</span><button id="toggle" type="button" aria-pressed="false">暂停动画 Ⅱ</button></footer>
</main>
<script>
const byId=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches, elapsed=0, previous=null;
const button=byId('toggle');
function sync(){button.textContent=paused?'播放动画 ▷':'暂停动画 Ⅱ';button.setAttribute('aria-pressed',String(paused));}
button.addEventListener('click',()=>{paused=!paused;sync()});sync();
function pose(t){
 const a=t*2*Math.PI/1.45,deg=a*180/Math.PI;
 byId('rearSpokes').setAttribute('transform',`rotate(${deg})`);
 byId('frontSpokes').setAttribute('transform',`rotate(${deg})`);
 byId('crank').setAttribute('transform',`translate(532 449) rotate(${deg})`);
 const x=532+29*Math.cos(a),y=449+29*Math.sin(a),fx=1064-x,fy=898-y;
 byId('nearLeg').setAttribute('d',`M499 328 Q466 369 ${478+12*Math.cos(a)} ${384+9*Math.sin(a)} L${x} ${y}`);
 byId('farLeg').setAttribute('d',`M512 328 Q554 354 ${560+10*Math.cos(a+Math.PI)} ${382+8*Math.sin(a+Math.PI)} L${fx} ${fy}`);
 byId('nearFoot').setAttribute('d',`M${x-11} ${y-4}l27 2`);
 byId('nearPedal').setAttribute('d',`M${x-12} ${y+3}h25`);
 byId('rider').setAttribute('transform',`translate(0 ${Math.sin(a*2)*1.5})`);
 byId('scarf').setAttribute('d',`M559 211Q519 ${195+Math.sin(a)*7} 480 ${215+Math.sin(a-1)*9}L492 ${230+Math.sin(a-1)*9}Q524 ${212+Math.sin(a)*7} 560 225`);
 byId('roadSurface').setAttribute('patternTransform',`translate(${-(t*125%240)} 0)`);
 byId('seaSurface').setAttribute('patternTransform',`translate(${-(t*14%180)} 0)`);
 byId('clouds').setAttribute('transform',`translate(${Math.sin(t*.12)*25} 0)`);
}
function frame(now){if(previous!==null&&!paused)elapsed+=Math.min((now-previous)/1000,.05);previous=now;pose(elapsed);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
