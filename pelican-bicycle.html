<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1726;font-family:system-ui,sans-serif;color:#eaf2ff;overflow:hidden}.scene{width:min(100vw,1100px);aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:linear-gradient(#7bc8ef 0 56%,#f6ce7a 56%);box-shadow:0 24px 80px #0008}svg{width:100%;height:100%;display:block}.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}.pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite reverse}.bike{animation:ride 2.8s ease-in-out infinite}.pelican{animation:bob .7s ease-in-out infinite alternate}.wing{transform-box:fill-box;transform-origin:75% 70%;animation:flap .8s ease-in-out infinite alternate}.beak{animation:beak 2.8s ease-in-out infinite}.cloud{animation:cloud 18s linear infinite}.cloud.two{animation-delay:-9s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes ride{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}@keyframes bob{to{transform:translateY(-5px)}}@keyframes flap{to{transform:rotate(-9deg)}}@keyframes beak{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(5deg)}}@keyframes cloud{from{transform:translateX(-180px)}to{transform:translateX(1180px)}}@media(prefers-reduced-motion:reduce){.wheel,.pedal,.bike,.pelican,.wing,.beak,.cloud{animation:none}}
</style>
</head>
<body>

<path d="M0 348c170-38 285 40 430 2s280-32 410 0 184 24 260-4v274H0z" fill="url(#sea)"/>
<path d="M0 395c150-28 280 34 432 4s286-28 420 2 168 18 248-2" fill="none" stroke="#b8edf0" stroke-width="8" opacity=".55"/>

<path d="M410 485 505 390h125l60 95H410l95-95 55 95" stroke="#d94e55" stroke-width="10"/><path d="M505 390l-22-45M483 345h55M630 390l30-44h38"/><circle cx="560" cy="485" r="27" fill="#f4c44e"/><g class="pedal"><path d="M560 458v54M533 485h54"/></g><path d="M628 390h34"/>
</g>
<g class="pelican">

<path class="wing" d="M520 281c-38 22-47 82-8 109 18 12 43-6 55-35 11-29-7-66-47-74z" fill="#d2d9dc" stroke="#172b3a" stroke-width="7"/>
<path d="M505 213c-32-50-18-96 24-110 51-16 101 21 95 79-4 39-34 69-70 72z" fill="#f5f1df" stroke="#172b3a" stroke-width="7"/>

<path d="M609 221c40 14 84 17 111 8" fill="none" stroke="#c56740" stroke-width="5"/>
<path d="M518 386l-16 66M590 390l25 62M492 452h43M605 452h42" stroke="#172b3a" stroke-width="9"/><path d="M520 245c-20-12-28-28-29-48" fill="none" stroke="#fff" stroke-width="9" opacity=".8"/>
</g>
<g fill="#f7e4a7" stroke="#172b3a" stroke-width="5"><path d="M170 490v-87l-35 28"/><path d="M900 490v-92l36 25"/></g><path d="M125 490h95M855 490h95" stroke="#172b3a" stroke-width="7"/>
</svg></div>
</body></html>
