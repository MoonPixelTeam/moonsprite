<script>
const el=id=>document.getElementById(id),motion=matchMedia('(prefers-reduced-motion: reduce)');let paused=motion.matches,time=0,last=null;
function paint(t){const a=t*Math.PI*2/1500;for(const id of ['rear','front'])el(id).setAttribute('transform',`rotate(${t*.19})`);el('crank').setAttribute('transform',`rotate(${a*180/Math.PI} 494 426)`);for(const [side,phase,hx] of [['Far',0,466],['Near',Math.PI,470]]){const x=494+32*Math.cos(a+phase),y=426+32*Math.sin(a+phase),hy=311,dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),bend=Math.sqrt(Math.max(0,80*80-d*d/4)),kx=(hx+x)/2-dy/d*bend,ky=(hy+y)/2+dx/d*bend;el('leg'+side).setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${x} ${y}`);el('foot'+side).setAttribute('transform',`translate(${x} ${y})`);}}
function state(){el('scene').classList.toggle('paused',paused);el('toggle').textContent=paused?'播放动画':'暂停动画';el('toggle').setAttribute('aria-pressed',String(paused));}el('toggle').addEventListener('click',()=>{paused=!paused;state()});motion.addEventListener('change',e=>{paused=e.matches;state()});function frame(now){if(last!==null&&!paused)time+=Math.min(now-last,60);last=now;paint(time);requestAnimationFrame(frame)}state();paint(0);requestAnimationFrame(frame);
</script>
